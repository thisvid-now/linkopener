<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Resumable Link Launcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        textarea {
            flex: 1;
            min-height: 100px;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            outline: none;
        }

        textarea:focus,
        input:focus {
            border-color: #2563eb;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .controls {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;

            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .controls label {
            font-weight: bold;
        }

        .controls input {
            width: 90px;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .open-next {
            background: #16a34a;
            font-weight: bold;
        }

        .open-next:hover {
            background: #15803d;
        }

        .resume {
            background: #7c3aed;
        }

        .resume:hover {
            background: #6d28d9;
        }

        .reset {
            background: #dc2626;
        }

        .reset:hover {
            background: #b91c1c;
        }

        .status {
            color: #555;
            font-size: 14px;
            margin-left: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            transition: 0.15s;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, .1);
        }

        .card.opened {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .card.current {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .card-url {
            color: #666;
            font-size: 14px;
            word-break: break-all;
        }

        .card-status {
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .opened-status {
            color: #16a34a;
        }

        .current-status {
            color: #2563eb;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 40px;
        }

        .url-info {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .input-box {
                flex-direction: column;
            }

            .controls {
                align-items: stretch;
            }

            .status {
                margin-left: 0;
                width: 100%;
            }

            .controls input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="input-box">
            <textarea
                id="urlInput"
                placeholder="Add URLs separated by ;

https://google.com;https://github.com;https://example.com"
            ></textarea>

            <button onclick="addLinks()">
                Add Links
            </button>
        </div>

        <div class="url-info">
            <strong>Progress is stored in the URL.</strong>
            You can close this page and reopen the same URL later to continue where you stopped.
        </div>

        <div class="controls">

            <label for="startInput">
                Start from:
            </label>

            <input
                id="startInput"
                type="number"
                min="1"
                value="1"
            />

            <button
                class="open-next"
                onclick="openNext()"
            >
                Open Next
            </button>

            <button
                class="resume"
                onclick="resumeFromStart()"
            >
                Resume
            </button>

            <button
                class="reset"
                onclick="resetProgress()"
            >
                Reset
            </button>

            <div
                class="status"
                id="status"
            >
                No links
            </div>

        </div>

        <div
            id="cards"
            class="cards"
        ></div>

    </div>

    <script>

        const input = document.getElementById("urlInput");
        const cards = document.getElementById("cards");
        const startInput = document.getElementById("startInput");
        const status = document.getElementById("status");


        // ==================================================
        // GET STATE FROM URL
        // ==================================================

        function getStateFromURL() {

            const params = new URLSearchParams(
                window.location.search
            );

            const linksParam = params.get("links");

            let current = parseInt(
                params.get("current") || "1",
                10
            );

            if (isNaN(current) || current < 1) {
                current = 1;
            }

            const links = linksParam
                ? linksParam
                    .split(";")
                    .map(link => link.trim())
                    .filter(Boolean)
                : [];

            return {
                links,
                current
            };
        }


        // ==================================================
        // SAVE STATE TO URL
        // ==================================================

        function saveStateToURL(links, current) {

            const params = new URLSearchParams();

            if (links.length > 0) {
                params.set(
                    "links",
                    links.join(";")
                );
            }

            params.set(
                "current",
                current
            );

            const newURL =
                window.location.pathname +
                "?" +
                params.toString();

            history.replaceState(
                null,
                "",
                newURL
            );
        }


        // ==================================================
        // NORMALIZE URL
        // ==================================================

        function normalizeURL(url) {

            url = url.trim();

            if (!url) {
                return "";
            }

            if (!/^https?:\/\//i.test(url)) {
                return "https://" + url;
            }

            return url;
        }


        // ==================================================
        // RENDER
        // ==================================================

        function render() {

            const state = getStateFromURL();

            const links = state.links;
            const current = state.current;

            startInput.value = current;

            cards.innerHTML = "";


            // No links
            if (links.length === 0) {

                status.textContent = "No links";

                cards.innerHTML = `
                    <div class="empty">
                        No links added yet.
                    </div>
                `;

                return;
            }


            // Finished
            if (current > links.length) {

                status.textContent =
                    `Completed: ${links.length} / ${links.length}`;

            } else {

                status.textContent =
                    `Next: #${current} | ` +
                    `Progress: ${current - 1} / ${links.length}`;
            }


            // Render cards

            links.forEach((url, index) => {

                const number = index + 1;

                const card =
                    document.createElement("div");

                card.className = "card";


                // Already opened

                if (number < current) {
                    card.classList.add("opened");
                }


                // Current link

                if (number === current) {
                    card.classList.add("current");
                }


                card.innerHTML = `

                    <div class="card-title">
                        #${number} — Launch Link
                    </div>

                    <div class="card-url"></div>

                    ${
                        number < current
                            ? `
                                <div class="card-status opened-status">
                                    ✓ Opened
                                </div>
                            `
                            : number === current
                                ? `
                                    <div class="card-status current-status">
                                        ▶ Next
                                    </div>
                                `
                                : ""
                    }

                `;


                card.querySelector(
                    ".card-url"
                ).textContent = url;


                // Open individual link

                card.addEventListener(
                    "click",
                    () => openIndividualLink(index)
                );


                cards.appendChild(card);

            });

        }


        // ==================================================
        // OPEN INDIVIDUAL LINK
        // ==================================================

        function openIndividualLink(index) {

            const state = getStateFromURL();

            if (
                index < 0 ||
                index >= state.links.length
            ) {
                return;
            }

            const url = state.links[index];


            // Open link

            window.open(
                url,
                "_blank",
                "noopener,noreferrer"
            );


            /*
             * If we open link #5 directly,
             * progress becomes #6.
             *
             * But if we open an older link,
             * don't move progress backwards.
             */

            const newCurrent = Math.max(
                state.current,
                index + 2
            );


            saveStateToURL(
                state.links,
                newCurrent
            );


            render();
        }


        // ==================================================
        // OPEN NEXT
        // ==================================================

        function openNext() {

            const state = getStateFromURL();

            const links = state.links;
            const current = state.current;


            if (links.length === 0) {

                alert("No links have been added.");

                return;
            }


            // Everything finished

            if (current > links.length) {

                alert("All links have been opened.");

                return;
            }


            /*
             * current is the link number,
             * not a zero-based array index.
             *
             * current = 1 -> links[0]
             * current = 2 -> links[1]
             * current = 3 -> links[2]
             */

            const index = current - 1;

            const url = links[index];


            // Open current link

            window.open(
                url,
                "_blank",
                "noopener,noreferrer"
            );


            /*
             * IMPORTANT:
             *
             * Immediately save the NEXT link number.
             *
             * Example:
             *
             * Before:
             * current=5
             *
             * Open #5
             *
             * URL becomes:
             * current=6
             *
             * If page is closed now,
             * reopening the URL starts at #6.
             */

            saveStateToURL(
                links,
                current + 1
            );


            render();
        }


        // ==================================================
        // RESUME FROM NUMBER
        // ==================================================

        function resumeFromStart() {

            const state = getStateFromURL();

            let number = parseInt(
                startInput.value,
                10
            );


            if (isNaN(number) || number < 1) {
                number = 1;
            }


            if (state.links.length > 0) {

                number = Math.min(
                    number,
                    state.links.length
                );

            }


            saveStateToURL(
                state.links,
                number
            );


            render();
        }


        // ==================================================
        // START INPUT CHANGE
        // ==================================================

        startInput.addEventListener(
            "change",
            () => {

                let number = parseInt(
                    startInput.value,
                    10
                );

                const state = getStateFromURL();


                if (isNaN(number) || number < 1) {
                    number = 1;
                }


                if (state.links.length > 0) {

                    number = Math.min(
                        number,
                        state.links.length
                    );

                }


                startInput.value = number;
            }
        );


        // ==================================================
        // RESET
        // ==================================================

        function resetProgress() {

            const state = getStateFromURL();


            saveStateToURL(
                state.links,
                1
            );


            render();
        }


        // ==================================================
        // ADD LINKS
        // ==================================================

        function addLinks() {

            const value = input.value.trim();

            if (!value) {
                return;
            }


            const newLinks = value
                .split(";")
                .map(normalizeURL)
                .filter(Boolean);


            const state = getStateFromURL();

            const existingLinks = state.links;


            /*
             * Avoid duplicates
             */

            const allLinks = [
                ...existingLinks,
                ...newLinks.filter(
                    link =>
                        !existingLinks.includes(link)
                )
            ];


            /*
             * Keep current progress.
             *
             * If there were no links before,
             * start at #1.
             */

            const current =
                existingLinks.length === 0
                    ? 1
                    : state.current;


            saveStateToURL(
                allLinks,
                current
            );


            input.value = "";

            render();
        }


        // ==================================================
        // CTRL/CMD + ENTER
        // ==================================================

        input.addEventListener(
            "keydown",
            event => {

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key === "Enter"
                ) {

                    addLinks();

                }

            }
        );


        // ==================================================
        // INITIAL LOAD
        // ==================================================

        render();

    </script>

</body>

</html>
